 DATA FORMAT  (every field explained — you can add entries by hand)
 -----------------------------------------------------------------------------
   KANA entry:
     {k:'し', r:'shi', sc:'hira', g:'base', row:'sa', col:'i', s:1, alt:[]}
       k    the character itself          (also used to build the id)
       r    Hepburn romaji                (shi / chi / tsu / fu / ji / wo / n)
       sc   script: 'hira' or 'kata'
       g    group: base | dakuten | handakuten | yoon | ext
       row  gojuon row key: a ka sa ta na ha ma ya ra wa n ga za da ba pa
            kya sha cha nya hya mya rya gya ja bya pya ext
       col  column: a i u e o   (yoon rows use a/u/o; 'n' uses 'n')
       s    stroke count (omitted for multi-character combos)
       alt  optional extra spellings accepted in the typing drill
     id = 'kana:' + sc + ':' + k          e.g. kana:hira:し

   KANJI entry:
     {k:'食', mean:'to eat; food', on:['ショク'], kun:['た(べる)'], s:9,
      grp:'verb', comp:[{w:'食べる', r:'たべる', m:'to eat'}]}
       k/mean/s  character, English meaning, stroke count
       on   on'yomi in KATAKANA      kun  kun'yomi in hiragana, okurigana in ()
       grp  group key for the heatmap: num time people pos verb place adj dir other
       comp 2-3 common words, each using ONLY kanji that are in this array
       extra:true  = beyond the spec's list, needed to write N5 words (曜, 好)
     id = 'kanji:' + k                    e.g. kanji:食

   VOCAB entry:
     {w:'食べる', r:'たべる', en:'to eat', pos:'v1', th:'verb'}
       w    written form. Kanji only if every kanji in it is in KANJI; else kana
       r    reading, always kana        en  English meaning
       pos  n pron adn num counter v5 v1 virr vsuru adj-i adj-na adv part conj
            exp inter pre suf qword       (v5 = Group I, v1 = Group II)
       th   theme key, see VOCAB_THEMES
     id = 'vocab:' + w + '|' + r          e.g. vocab:食べる|たべる

   GRAMMAR entry:
     {p:'～てください', grp:'vform', mean:'Please do ~.',
      form:'て-form + ください',
      ex:[{jp:'ここに 名前を 書いてください。', en:'Please write your name here.'},

      note:'This is a request. For permission you need ～てもいいですか.',
      q:{s:'ここに 名前を ＿＿ください。', a:'書いて',

      parts:['ここに','あなたの','名前を','書いてください']}
       p     pattern, also the id      grp  group key, see GRAMMAR_GROUPS
       mean  what it does              form how to build it
       ex    exactly 2 examples, spaces between phrases as the N5 paper prints
       note  optional "do not confuse this with…"
       q     fill-in-the-blank drill: ＿＿ marks the blank, d = 3 wrong answers
       parts optional 4 chunks in the right order, for the exam's 文の組み立て
     id = 'grammar:' + p                  e.g. grammar:～てください

  --m0:#ece7dd; --m1:#e8d3bd; --m2:#e0b489; --m3:#cf8d4f; --m4:#a85c2a;
  --radius:16px; --tap:48px;
  --jp:"Hiragino Sans","Yu Gothic",Meiryo,"Noto Sans JP","MS Gothic",sans-serif;
  --ui:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --paper:#14161d;      --surface:#1c1f28;    --surface-2:#242832;
  --ink:#eae7e0;        --ink-soft:#a9aec0;   --ink-faint:#6d7488;
  --accent:#dd8a52;     --accent-ink:#1a1206; --accent-soft:#3a2a1c;
  --ok:#77c089;         --ok-soft:#1e2e23;
  --bad:#e0837a;        --bad-soft:#33201e;
  --line:#2b2f3b;       --shadow:rgba(0,0,0,.45);
  --m0:#262a34; --m1:#4a3524; --m2:#6d4a2c; --m3:#9a6634; --m4:#d08a45;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.jp{font-family:var(--jp)}

/* ===== LAYOUT ============================================================= */
#app{max-width:720px;margin:0 auto;padding:0 12px 48px}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px;
}
.brand{font-family:var(--jp);font-size:20px;font-weight:700;letter-spacing:.04em;
  margin-bottom:8px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{
  flex:1 1 auto;min-height:40px;min-width:60px;padding:6px 10px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;font-size:14px;color:var(--ink-soft);
}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);
  border-color:var(--accent);font-weight:600}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:24px 0 10px;color:var(--ink)}
h3{font-size:15px;margin:16px 0 6px;color:var(--ink-soft);font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--ink-soft);font-size:14px}
.tiny{color:var(--ink-faint);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:0 1px 2px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.center{text-align:center}

/* ===== BUTTONS ============================================================ */
.btn{
  min-height:var(--tap);padding:12px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:16px;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:600}
.btn-big{
  width:100%;min-height:96px;border-radius:20px;background:var(--accent);
  border:none;color:var(--accent-ink);font-size:17px;line-height:1.35;
  box-shadow:0 4px 14px var(--shadow);
}
.btn-big .jp{display:block;font-size:30px;font-weight:700;margin-bottom:2px}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}

/* ===== STUDY ============================================================== */
.prompt{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 12px;margin-bottom:14px;text-align:center;min-height:210px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  box-shadow:0 1px 2px var(--shadow);
}
.jp-huge{font-family:var(--jp);font-size:clamp(140px,38vw,200px);line-height:1.05;
  font-weight:500;letter-spacing:.02em}
.jp-mid{font-family:var(--jp);font-size:clamp(46px,14vw,72px);line-height:1.2;font-weight:500}
.prompt-label{font-size:13px;color:var(--ink-faint);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:6px}
.prompt-en{font-size:34px;font-weight:600;letter-spacing:.01em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{
  min-height:72px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px;text-align:center;position:relative;
}
.choice .num{position:absolute;top:6px;left:9px;font-size:11px;color:var(--ink-faint)}
.choice.jp{font-family:var(--jp);font-size:46px}
.choice.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.feedback{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-family:var(--jp);font-size:19px}
.typebox{
  width:100%;min-height:var(--tap);padding:12px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface);font-size:24px;text-align:center;
  letter-spacing:.06em;
}
.typebox:focus{outline:none;border-color:var(--accent)}
.typebox.ok{border-color:var(--ok);background:var(--ok-soft)}
.typebox.no{border-color:var(--bad);background:var(--bad-soft)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades .btn{padding:10px 4px;font-size:14px;flex-direction:column}
.grades .btn small{display:block;color:var(--ink-faint);font-size:11px}
.progressbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;
  margin:10px 0}
.progressbar i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .25s ease}
.sessionbar{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft)}

/* ===== TRACING ============================================================ */
.trace-wrap{position:relative;width:100%;max-width:320px;margin:0 auto;aspect-ratio:1/1;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.trace-wrap:before,.trace-wrap:after{content:"";position:absolute;background:var(--line)}
.trace-wrap:before{left:50%;top:6%;bottom:6%;width:1px}
.trace-wrap:after{top:50%;left:6%;right:6%;height:1px}
.trace-ghost{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--jp);font-size:min(62vw,240px);color:var(--ink);opacity:.13;
  user-select:none;pointer-events:none;line-height:1;
}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;
  border-radius:var(--radius);cursor:crosshair}

/* ===== CHARTS & GRIDS ===================================================== */
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.chart.yoon{grid-template-columns:repeat(3,1fr)}
.cell{
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:6px 2px;text-align:center;min-height:56px;display:flex;flex-direction:column;
  justify-content:center;
}
.cell .c{font-family:var(--jp);font-size:24px;line-height:1.1}
.cell .r{font-size:11px;color:var(--ink-faint)}
.cell.empty{border:none;background:transparent}
.cell.m0{background:var(--m0)} .cell.m1{background:var(--m1)} .cell.m2{background:var(--m2)}
.cell.m3{background:var(--m3);color:#fff} .cell.m4{background:var(--m4);color:#fff}
.cell.m3 .r,.cell.m4 .r{color:rgba(255,255,255,.8)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);
  align-items:center;margin-bottom:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;
  vertical-align:-2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;line-height:1.15}
.stat span{font-size:12px;color:var(--ink-soft)}
.ring{display:flex;align-items:center;gap:14px}
.ring .big{font-size:44px;font-weight:700;color:var(--accent);line-height:1}

/* ===== SETTINGS =========================================================== */
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:none}
.setting label{font-size:15px}
.setting .muted{margin:0}
.switch{width:52px;height:30px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);position:relative;flex:0 0 auto}
.switch i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:var(--ink-faint);transition:left .15s ease,background .15s ease}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] i{left:24px;background:var(--accent)}
select,input[type=number]{padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);min-height:40px}
input[type=number]{width:84px;text-align:center}
pre.report{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:12px;font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap}

/* ===== KANJI (checkpoint B) =============================================== */
.chart.kanji{grid-template-columns:repeat(5,1fr)}
.kcell{min-height:66px;padding:5px 1px}
.kcell .c{font-size:30px}
.kcell .r{font-size:10px;line-height:1.15;margin-top:1px;
  display:block;overflow:hidden;max-height:2.4em}
.kcell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.complist{margin-top:12px;width:100%}
.comp{display:flex;gap:8px;align-items:baseline;justify-content:center;
  flex-wrap:wrap;padding:3px 0}
.comp .jp{font-size:23px}
.comp .r{font-size:13px;color:var(--ink-soft)}
.comp .m{font-size:13px;color:var(--ink-faint)}
@media (min-width:600px){
  .chart.kanji{grid-template-columns:repeat(8,1fr)}
}

/* ===== VOCABULARY (checkpoint C) ========================================== */
.prompt-en-sm{font-size:24px;font-weight:600;line-height:1.3}
table.vtab{width:100%;border-collapse:collapse}
table.vtab td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top}
table.vtab tr:last-child td{border-bottom:none}
td.vw{width:44%}
button.plain{background:none;border:none;padding:0;text-align:left;width:100%}
td.vw .jp{font-size:21px;display:block;line-height:1.25}
td.vw .vr{font-size:12px;color:var(--ink-faint);display:block}
td.ve{font-size:14px;color:var(--ink-soft)}
td.ve .vp{display:block;font-size:11px;color:var(--ink-faint)}

/* ===== GRAMMAR (checkpoint D) ============================================= */
.jp-sentence{font-family:var(--jp);font-size:clamp(24px,7vw,34px);line-height:1.5;
  font-weight:500}
.exlist{margin:8px 0}
.exrow{border-left:3px solid var(--accent-soft);padding:2px 0 2px 10px;margin-bottom:8px;
  text-align:left}
.exrow .jp{font-size:19px;line-height:1.45;display:block}
.exrow .en{font-size:13px;color:var(--ink-soft)}

/* ===== MOCK EXAM (checkpoint E) =========================================== */
.card.passage{font-size:19px;line-height:1.85;background:var(--surface-2)}
u.target{text-decoration:none;border-bottom:3px solid var(--accent);padding-bottom:2px}
.choice.picked{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

/* @@CSS@@ — add new component styles above this marker, colours as var(--…) */

/* ===== MISC =============================================================== */
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--surface-2);
  font-size:12px;color:var(--ink-soft)}
.pill.on{background:var(--accent-soft);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:90vw}
#toast.show{opacity:.95}
.lesson{border-left:3px solid var(--accent);padding-left:12px;margin-bottom:16px}
.lesson .ex{font-family:var(--jp);font-size:20px;margin:2px 0}
.kbdhint{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:10px}
.hidden{display:none !important}

/* ===== ANIMATION ========================================================== */
@keyframes pulseOk{0%{box-shadow:0 0 0 0 var(--ok)}70%{box-shadow:0 0 0 14px transparent}
  100%{box-shadow:0 0 0 0 transparent}}
@keyframes shakeNo{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.anim-ok{animation:pulseOk .45s ease-out}
.anim-no{animation:shakeNo .4s ease}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@media (min-width:600px){
  .choices{grid-template-columns:1fr 1fr 1fr 1fr}
  .chart{gap:8px}
  .cell{min-height:64px}
  .cell .c{font-size:28px}
}
</style>

   id = 'grammar:' + p                e.g. grammar:～てください
   ========================================================================= */
var GRAMMAR = [
/* --- basic sentences ----------------------------------------------------- */
{p:'～は～です',grp:'basic',mean:'A is B. The basic Japanese sentence.',
 form:'noun + は + noun + です',
 ex:[{jp:'わたしは 学生です。',en:'I am a student.'},
     {jp:'これは 本です。',en:'This is a book.'}],
 note:'は as a particle is written with the kana は but pronounced "wa".',
 q:{s:'わたし＿＿ 日本人です。',a:'は',d:['が','を','に']},
 parts:['わたしは','日本語の','学生','です']},
{p:'～は～ではありません',grp:'basic',mean:'A is not B.',
 form:'noun + は + noun + ではありません',
 ex:[{jp:'わたしは 先生ではありません。',en:'I am not a teacher.'},
     {jp:'これは わたしの かばんではありません。',en:'This is not my bag.'}],
 note:'じゃありません means exactly the same and sounds more casual.',
 q:{s:'わたしは 先生＿＿。',a:'ではありません',d:['ではありました','ではないます','でありませんでした']}},
{p:'～は～でした',grp:'basic',mean:'A was B (past of です).',
 form:'noun + は + noun + でした',
 ex:[{jp:'きのうは 雨でした。',en:'Yesterday was rainy.'},
     {jp:'先週は 休みでした。',en:'Last week was a holiday.'}],
 note:'For nouns the past is でした. For い-adjectives it is ～かったです — never ～いでした.',
 q:{s:'きのうは 雨＿＿。',a:'でした',d:['ました','でしただ','いました']}},
{p:'～ですか',grp:'basic',mean:'Turns a statement into a question.',
 form:'sentence + か',
 ex:[{jp:'あなたは 学生ですか。',en:'Are you a student?'},
     {jp:'これは 何ですか。',en:'What is this?'}],
 note:'Japanese does not need a question mark. The か is the question.',
 q:{s:'これは 何＿＿。',a:'ですか',d:['ますか','ましたか','です']}},
{p:'～も',grp:'basic',mean:'~ too, ~ also.',
 form:'noun + も (it replaces は or が)',
 ex:[{jp:'わたしも 学生です。',en:'I am a student too.'},
     {jp:'かれも 来ました。',en:'He came as well.'}],
 note:'も replaces は — you never say ～はも or ～もは.',
 q:{s:'わたしは 学生です。かれ＿＿ 学生です。',a:'も',d:['を','に','で']}},
{p:'～の',grp:'basic',mean:'Joins two nouns: of, belonging to.',
 form:'noun + の + noun',
 ex:[{jp:'これは わたしの 本です。',en:'This is my book.'},
     {jp:'日本語の 先生です。',en:'He is a Japanese teacher.'}],
 note:'The owner comes first: 先生の車 = the teacher’s car.',
 q:{s:'これは 先生＿＿ 車です。',a:'の',d:['と','も','を']},
 parts:['これは','日本語の','先生の','本です']},
{p:'～と～（noun and noun）',grp:'basic',mean:'~ and ~ (a complete list).',
 form:'noun + と + noun',
 ex:[{jp:'パンと たまごを 買いました。',en:'I bought bread and eggs.'},
     {jp:'わたしと 友だちは 学生です。',en:'My friend and I are students.'}],
 note:'と only joins nouns. It cannot join verbs or adjectives.',
 q:{s:'パン＿＿ たまごを 買いました。',a:'と',d:['に','で','は']}},
{p:'これ・それ・あれ',grp:'basic',mean:'this one · that one · that one over there.',
 form:'これ = near me · それ = near you · あれ = away from us both',
 ex:[{jp:'これは いくらですか。',en:'How much is this?'},
     {jp:'あれは 駅です。',en:'That over there is the station.'}],
 note:'これ stands in for a noun on its own. For "this book" you need この本.',
 q:{s:'＿＿は わたしの かばんです。',a:'これ',d:['この','ここ','こちら']}},
{p:'この・その・あの＋noun',grp:'basic',mean:'this ~ · that ~ · that ~ over there.',
 form:'この / その / あの + noun',
 ex:[{jp:'この 本は おもしろいです。',en:'This book is interesting.'},
     {jp:'あの 人は 先生です。',en:'That person over there is a teacher.'}],
 note:'この must be followed by a noun. Alone it is これ.',
 q:{s:'＿＿ 本は 高いです。',a:'この',d:['これ','ここ','これの']}},
{p:'ここ・そこ・あそこ',grp:'basic',mean:'here · there · over there.',
 form:'place word + です / に',
 ex:[{jp:'トイレは そこです。',en:'The toilet is there.'},
     {jp:'ここは 駅ですか。',en:'Is this the station?'}],
 note:'ここ is a place. これ is a thing. Do not swap them.',
 q:{s:'トイレは ＿＿です。',a:'そこ',d:['それ','そんな','そちらの']}},
/* --- particles ----------------------------------------------------------- */
{p:'～を',grp:'part',mean:'Marks the object — the thing the verb acts on.',
 form:'noun + を + verb',
 ex:[{jp:'ごはんを 食べます。',en:'I eat a meal.'},
     {jp:'新聞を 読みました。',en:'I read the newspaper.'}],
 note:'を is used for nothing else in modern Japanese, and it is pronounced "o".',
 q:{s:'ごはん＿＿ 食べます。',a:'を',d:['が','に','で']},
 parts:['わたしは','あさごはんを','うちで','食べます']},
{p:'～に（time）',grp:'part',mean:'at, on, in — a point in time.',
 form:'time + に + verb',
 ex:[{jp:'七時に おきます。',en:'I get up at seven.'},
     {jp:'月曜日に 会いましょう。',en:'Let’s meet on Monday.'}],
 note:'Use に with clock times, days and dates — but never with 今日, あした or 毎日.',
 q:{s:'七時＿＿ おきます。',a:'に',d:['で','を','が']}},
{p:'～に（destination）',grp:'part',mean:'to — where you are going.',
 form:'place + に + 行きます / 来ます / かえります',
 ex:[{jp:'学校に 行きます。',en:'I go to school.'},
     {jp:'うちに かえります。',en:'I am going home.'}],
 note:'に and へ both work for a destination; に is the more common one.',
 q:{s:'学校＿＿ 行きます。',a:'に',d:['を','で','と']}},
{p:'～へ',grp:'part',mean:'towards — direction of movement.',
 form:'place + へ + a movement verb',
 ex:[{jp:'駅へ 行きます。',en:'I am going to the station.'},
     {jp:'日本へ 来ました。',en:'I came to Japan.'}],
 note:'As a particle, へ is pronounced "e", not "he".',
 q:{s:'駅＿＿ 行きます。',a:'へ',d:['を','が','の']}},
{p:'～で（place of an action）',grp:'part',mean:'at, in — where something happens.',
 form:'place + で + verb',
 ex:[{jp:'会社で はたらきます。',en:'I work at a company.'},
     {jp:'としょかんで 本を 読みます。',en:'I read books at the library.'}],
 note:'で is where an action happens; に is where something simply exists.',
 q:{s:'会社＿＿ はたらきます。',a:'で',d:['に','を','へ']}},
{p:'～で（means）',grp:'part',mean:'by, with, in — the tool or method.',
 form:'tool + で + verb',
 ex:[{jp:'電車で 行きます。',en:'I go by train.'},
     {jp:'えんぴつで 書いてください。',en:'Please write with a pencil.'}],
 note:'Same particle as the place で. 日本語で話します = I speak in Japanese.',
 q:{s:'電車＿＿ 行きます。',a:'で',d:['に','を','と']}},
{p:'～と（with a person）',grp:'part',mean:'with — doing something together.',
 form:'person + と + verb',
 ex:[{jp:'友だちと 話しました。',en:'I talked with a friend.'},
     {jp:'母と 買いものを しました。',en:'I went shopping with my mother.'}],
 note:'と for people, で for tools: 友だちと行きます ○ / 電車で行きます ○.',
 q:{s:'友だち＿＿ 行きます。',a:'と',d:['で','を','が']}},
{p:'～から～まで',grp:'part',mean:'from ~ until ~ (time or place).',
 form:'start + から + end + まで',
 ex:[{jp:'九時から 五時まで はたらきます。',en:'I work from nine to five.'},
     {jp:'うちから 駅まで あるきます。',en:'I walk from home to the station.'}],
 note:'Works for both time and place, and either half can be used alone.',
 q:{s:'九時＿＿ 五時まで はたらきます。',a:'から',d:['まで','に','で']},
 parts:['毎日','九時から','五時まで','はたらきます']},
{p:'～が（subject）',grp:'part',mean:'Marks the subject, especially new information.',
 form:'noun + が + verb or adjective',
 ex:[{jp:'雨が ふって います。',en:'It is raining.'},
     {jp:'だれが 来ましたか。',en:'Who came?'}],
 note:'After a question word such as だれ or 何 as the subject, use が, not は.',
 q:{s:'だれ＿＿ 来ましたか。',a:'が',d:['は','を','も']}},
{p:'～や',grp:'part',mean:'~ and ~ (an incomplete list).',
 form:'noun + や + noun',
 ex:[{jp:'本や ノートを 買いました。',en:'I bought books, notebooks and so on.'},
     {jp:'つくえの 上に 本や ノートが あります。',en:'There are books and notebooks on the desk.'}],
 note:'や implies there is more. と means that is the whole list.',
 q:{s:'本＿＿ ノートを 買いました。',a:'や',d:['に','で','は']}},
{p:'～か～（or）',grp:'part',mean:'~ or ~.',
 form:'noun + か + noun',
 ex:[{jp:'コーヒーか おちゃを 飲みます。',en:'I will drink coffee or tea.'},
     {jp:'あしたか あさって 行きます。',en:'I will go tomorrow or the day after.'}],
 note:'The same か that makes a question also means "or" between two nouns.',
 q:{s:'ペン＿＿ えんぴつで 書いてください。',a:'か',d:['を','に','は']}},
{p:'～ね・～よ',grp:'part',mean:'ね asks for agreement; よ tells you something new.',
 form:'sentence + ね / よ',
 ex:[{jp:'いい 天気ですね。',en:'Nice weather, isn’t it?'},
     {jp:'この 本は おもしろいですよ。',en:'This book is interesting, you know.'}],
 note:'ね expects you to agree. よ assumes you did not know.',
 q:{s:'いい 天気です＿＿。',a:'ね',d:['に','を','で']}},
{p:'～だけ',grp:'part',mean:'only, just.',
 form:'noun + だけ',
 ex:[{jp:'水だけ 飲みます。',en:'I only drink water.'},
     {jp:'百円だけ あります。',en:'I only have a hundred yen.'}],
 note:'だけ takes a normal positive verb. しか needs a negative one.',
 q:{s:'水＿＿ 飲みます。',a:'だけ',d:['しか','など','まで']}},
{p:'～しか～ない',grp:'part',mean:'only ~ (and that feels like too little).',
 form:'noun + しか + negative verb',
 ex:[{jp:'水しか ありません。',en:'There is only water.'},
     {jp:'百円しか ありません。',en:'I have only a hundred yen.'}],
 note:'しか must have a negative verb after it: ～しかありません ○ / ～しかあります ×.',
 q:{s:'水＿＿ ありません。',a:'しか',d:['だけ','まで','など']}},
{p:'～ぐらい',grp:'part',mean:'about, approximately.',
 form:'amount + ぐらい',
 ex:[{jp:'三十分ぐらい あるきました。',en:'I walked for about thirty minutes.'},
     {jp:'千円ぐらいです。',en:'It is about a thousand yen.'}],
 note:'ぐらい and くらい are the same word. Both are correct.',
 q:{s:'三十分＿＿ あるきました。',a:'ぐらい',d:['まで','しか','だけ']}},
{p:'～など',grp:'part',mean:'and so on, things like that.',
 form:'list + など',
 ex:[{jp:'やさいや くだものなどを 買いました。',en:'I bought vegetables, fruit and so on.'},
     {jp:'日本語や えいごなどを ならいます。',en:'I study Japanese, English and so on.'}],
 note:'など comes after the list, and often pairs with や.',
 q:{s:'やさいや くだもの＿＿を 買いました。',a:'など',d:['だけ','しか','ぐらい']}},

/* --- verbs: the polite forms --------------------------------------------- */
{p:'～ます',grp:'verb',mean:'Polite present and future: I do, I will do.',
 form:'Group I: change the last kana to the い-row + ます · Group II: drop る + ます · する → します · 来る → 来ます',
 ex:[{jp:'毎日 日本語を べんきょうします。',en:'I study Japanese every day.'},
     {jp:'あした 学校に 行きます。',en:'I will go to school tomorrow.'}],
 note:'ます covers the present and the future. Japanese has no separate future tense.',
 q:{s:'あした 学校に ＿＿。',a:'行きます',d:['行って','行った','行かない']}},
{p:'～ません',grp:'verb',mean:'Polite negative: I do not do.',
 form:'ます → ません',
 ex:[{jp:'にくを 食べません。',en:'I do not eat meat.'},
     {jp:'おさけを 飲みません。',en:'I do not drink alcohol.'}],
 note:'Only the ending changes. The stem in front of it stays exactly the same.',
 q:{s:'にくを ＿＿。',a:'食べません',d:['食べます','食べました','食べましょう']}},
{p:'～ました',grp:'verb',mean:'Polite past: I did.',
 form:'ます → ました',
 ex:[{jp:'きのう えいがを 見ました。',en:'I watched a film yesterday.'},
     {jp:'てがみを 書きました。',en:'I wrote a letter.'}],
 note:'でした is for nouns and な-adjectives; ました is for verbs.',
 q:{s:'きのう えいがを ＿＿。',a:'見ました',d:['見ます','見ません','見ましょう']}},
{p:'～ませんでした',grp:'verb',mean:'Polite past negative: I did not do.',
 form:'ます → ませんでした',
 ex:[{jp:'きのうは 学校に 行きませんでした。',en:'I did not go to school yesterday.'},
     {jp:'何も 食べませんでした。',en:'I did not eat anything.'}],
 note:'何も, だれも and どこも all take a negative verb.',
 q:{s:'きのうは 学校に ＿＿。',a:'行きませんでした',d:['行きました','行きません','行きましょう']}},
{p:'plain form（dictionary form）',grp:'verb',mean:'The plain form — how a verb appears in a dictionary.',
 form:'食べる · 飲む · する · 来る',
 ex:[{jp:'テレビを 見る 前に しゅくだいを します。',en:'I do my homework before watching television.'},
     {jp:'本を 読む 時間が ありません。',en:'I have no time to read books.'}],
 note:'You need the plain form before 前に and before a noun. ます-form cannot go there.',
 q:{s:'テレビを ＿＿ 前に しゅくだいを します。',a:'見る',d:['見ます','見て','見た']}},
{p:'～ませんか',grp:'verb',mean:'A polite invitation: won’t you ~ ?',
 form:'ます-stem + ませんか',
 ex:[{jp:'いっしょに ひるごはんを 食べませんか。',en:'Won’t you have lunch with me?'},
     {jp:'こんばん えいがを 見ませんか。',en:'How about seeing a film tonight?'}],
 note:'It looks like a negative question but it is an invitation.',
 q:{s:'いっしょに ひるごはんを ＿＿。',a:'食べませんか',d:['食べますか','食べましたか','食べないか']}},
{p:'～ましょう',grp:'verb',mean:'Let’s do it.',
 form:'ます-stem + ましょう',
 ex:[{jp:'いっしょに 行きましょう。',en:'Let’s go together.'},
     {jp:'いっしょに べんきょうしましょう。',en:'Let’s study together.'}],
 note:'ませんか asks whether you want to. ましょう has already decided.',
 q:{s:'いっしょに ＿＿。',a:'行きましょう',d:['行きます','行きました','行かない']}},
{p:'～ましょうか',grp:'verb',mean:'Shall I ~ ? (offering to do it for you)',
 form:'ます-stem + ましょうか',
 ex:[{jp:'まどを あけましょうか。',en:'Shall I open the window?'},
     {jp:'タクシーを よびましょうか。',en:'Shall I call a taxi?'}],
 note:'ましょうか offers help. ましょう suggests doing something together.',
 q:{s:'まどを ＿＿。',a:'あけましょうか',d:['あけますか','あけましたか','あけてか']}},
/* --- verb forms ---------------------------------------------------------- */
{p:'て-form',grp:'vform',mean:'The connecting form. It carries no tense of its own.',
 form:'Group I: う・つ・る→って · む・ぶ・ぬ→んで · く→いて · ぐ→いで · す→して · Group II: drop る + て · する→して · 来る→来て · 行く→行って',
 ex:[{jp:'あさ おきて、ごはんを 食べます。',en:'I get up in the morning and eat a meal.'},
     {jp:'駅に 行って、電車に のります。',en:'I go to the station and get on the train.'}],
 note:'行く is the one Group I exception: 行って, never 行いて.',
 q:{s:'あさ ＿＿、ごはんを 食べます。',a:'おきて',d:['おきる','おきます','おきた']}},
{p:'～てください',grp:'vform',mean:'Please do ~.',
 form:'て-form + ください',
 ex:[{jp:'ここに 名前を 書いてください。',en:'Please write your name here.'},
     {jp:'ちょっと まってください。',en:'Please wait a moment.'}],
 note:'This is a request. To ask for permission you need ～てもいいですか.',
 q:{s:'ここに 名前を ＿＿ください。',a:'書いて',d:['書きます','書く','書いた']},
 parts:['ここに','あなたの','名前を','書いてください']},
{p:'～ています',grp:'vform',mean:'Is ~ing, right now.',
 form:'て-form + います',
 ex:[{jp:'今 本を 読んでいます。',en:'I am reading a book now.'},
     {jp:'雨が ふっています。',en:'It is raining.'}],
 note:'Also used for habits: 毎日 はたらいています.',
 q:{s:'今 本を ＿＿います。',a:'読んで',d:['読みます','読む','読んだ']}},
{p:'～てもいいです',grp:'vform',mean:'You may ~. With か it asks permission.',
 form:'て-form + もいいです（か）',
 ex:[{jp:'ここで しゃしんを とってもいいですか。',en:'May I take a photo here?'},
     {jp:'この ペンを つかってもいいです。',en:'You may use this pen.'}],
 note:'Do not confuse it with ～てください, which is asking someone else to act.',
 q:{s:'ここで しゃしんを ＿＿もいいですか。',a:'とって',d:['とります','とる','とった']}},
{p:'～てはいけません',grp:'vform',mean:'You must not ~.',
 form:'て-form + はいけません',
 ex:[{jp:'ここで たばこを すってはいけません。',en:'You must not smoke here.'},
     {jp:'ここに 車を とめてはいけません。',en:'You must not park here.'}],
 note:'The exact opposite of ～てもいいです.',
 q:{s:'ここで たばこを ＿＿はいけません。',a:'すって',d:['すいます','すう','すった']}},
{p:'～てから',grp:'vform',mean:'After doing ~.',
 form:'て-form + から',
 ex:[{jp:'ごはんを 食べてから、テレビを 見ます。',en:'After eating, I watch television.'},
     {jp:'しゅくだいを してから あそびます。',en:'I play after doing my homework.'}],
 note:'てから = after doing. Plain から after a sentence means "because".',
 q:{s:'ごはんを ＿＿から、テレビを 見ます。',a:'食べて',d:['食べます','食べる','食べた']}},
{p:'ない-form',grp:'vform',mean:'The plain negative form.',
 form:'Group I: last kana → あ-row + ない（う→わない）· Group II: drop る + ない · する→しない · 来る→来ない',
 ex:[{jp:'あしたは 学校に 行かない。',en:'I am not going to school tomorrow.'},
     {jp:'おさけを 飲まない 人も います。',en:'There are also people who do not drink.'}],
 note:'ある is the exception: its negative is just ない, not あらない.',
 q:{s:'あしたは 学校に ＿＿。',a:'行かない',d:['行きない','行くない','行らない']}},
{p:'～ないでください',grp:'vform',mean:'Please do not ~.',
 form:'ない-form (without ない) + ないでください',
 ex:[{jp:'ここに 車を とめないでください。',en:'Please do not park here.'},
     {jp:'まどを あけないでください。',en:'Please do not open the window.'}],
 note:'The negative twin of ～てください.',
 q:{s:'ここに 車を ＿＿ください。',a:'とめないで',d:['とめない','とめなくて','とめません']}},
{p:'た-form',grp:'vform',mean:'The plain past form.',
 form:'Exactly the て-form shape with た: って→った · んで→んだ · いて→いた · いで→いだ · して→した',
 ex:[{jp:'きのう 食べた ものは おいしかったです。',en:'What I ate yesterday was delicious.'},
     {jp:'先週 買った 本を 読みました。',en:'I read the book I bought last week.'}],
 note:'Before a noun the た-form describes it: 買った本 = the book I bought.',
 q:{s:'先週 ＿＿ 本を 読みました。',a:'買った',d:['買います','買う','買って']}},
{p:'～たいです',grp:'vform',mean:'I want to ~.',
 form:'ます-stem + たいです',
 ex:[{jp:'日本に 行きたいです。',en:'I want to go to Japan.'},
     {jp:'水が 飲みたいです。',en:'I want to drink water.'}],
 note:'～たい is your own wish. With たい, を often becomes が.',
 q:{s:'日本に ＿＿です。',a:'行きたい',d:['行きます','行って','行った']},
 parts:['わたしは','来年','日本に','行きたいです']},
{p:'～に行きます（purpose）',grp:'vform',mean:'Go somewhere in order to do something.',
 form:'ます-stem + に + 行きます / 来ます / かえります',
 ex:[{jp:'えいがを 見に 行きます。',en:'I am going to see a film.'},
     {jp:'ひるごはんを 食べに 行きましょう。',en:'Let’s go and have lunch.'}],
 note:'Use the ます-stem: 食べに行きます ○ / 食べるに行きます ×.',
 q:{s:'えいがを ＿＿に 行きます。',a:'見',d:['見る','見て','見ます']}},

/* --- adjectives ---------------------------------------------------------- */
{p:'い-adjective ＋ です',grp:'adj',mean:'Describing something politely.',
 form:'adjective + です — the final い stays',
 ex:[{jp:'この 本は おもしろいです。',en:'This book is interesting.'},
     {jp:'今日は あついです。',en:'It is hot today.'}],
 note:'Never put な after an い-adjective: 高い本 ○ / 高いな本 ×.',
 q:{s:'今日は ＿＿です。',a:'あつい',d:['あつく','あついな','あつくて']}},
{p:'い-adjective ～くないです',grp:'adj',mean:'Negative of an い-adjective.',
 form:'drop い + くないです（or ～くありません）',
 ex:[{jp:'この 本は おもしろくないです。',en:'This book is not interesting.'},
     {jp:'この 店は 安くないです。',en:'This shop is not cheap.'}],
 note:'いい is irregular: よくないです, never いくないです.',
 q:{s:'この 店は ＿＿です。',a:'安くない',d:['安いない','安くなって','安いくない']}},
{p:'い-adjective ～かったです',grp:'adj',mean:'Past of an い-adjective.',
 form:'drop い + かったです',
 ex:[{jp:'きのうは あつかったです。',en:'It was hot yesterday.'},
     {jp:'テストは むずかしかったです。',en:'The test was difficult.'}],
 note:'It is ～かったです. ～いでした does not exist.',
 q:{s:'テストは ＿＿です。',a:'むずかしかった',d:['むずかしいでした','むずかしくでした','むずかしました']}},
{p:'い-adjective ～くなかったです',grp:'adj',mean:'Past negative of an い-adjective.',
 form:'drop い + くなかったです',
 ex:[{jp:'テストは むずかしくなかったです。',en:'The test was not difficult.'},
     {jp:'天気は よくなかったです。',en:'The weather was not good.'}],
 note:'いい becomes よくなかったです.',
 q:{s:'天気は ＿＿です。',a:'よくなかった',d:['いくなかった','いいなかった','よいでした']}},
{p:'い-adjective ＋ noun',grp:'adj',mean:'Putting an adjective in front of a noun.',
 form:'adjective + noun, with nothing in between',
 ex:[{jp:'大きい 車を 買いました。',en:'I bought a big car.'},
     {jp:'新しい かばんが ほしいです。',en:'I want a new bag.'}],
 note:'No な and no の between an い-adjective and its noun.',
 q:{s:'＿＿ 車を 買いました。',a:'大きい',d:['大きいな','大きく','大きくて']},
 parts:['わたしは','先週','新しい','車を買いました']},
{p:'な-adjective ＋ です',grp:'adj',mean:'Describing with a な-adjective.',
 form:'adjective + です (no な here)',
 ex:[{jp:'この へやは しずかです。',en:'This room is quiet.'},
     {jp:'この 店は べんりです。',en:'This shop is convenient.'}],
 note:'The な only appears before a noun: しずかな へや.',
 q:{s:'この へやは ＿＿です。',a:'しずか',d:['しずかな','しずかい','しずかく']}},
{p:'な-adjective ～ではありません',grp:'adj',mean:'Negative of a な-adjective.',
 form:'adjective + ではありません（or じゃありません）',
 ex:[{jp:'この へやは しずかではありません。',en:'This room is not quiet.'},
     {jp:'この 店は べんりじゃありません。',en:'This shop is not convenient.'}],
 note:'な-adjectives behave like nouns here — not like い-adjectives.',
 q:{s:'この へやは しずか＿＿。',a:'ではありません',d:['くないです','くありません','いです']}},
{p:'な-adjective ～でした',grp:'adj',mean:'Past of a な-adjective.',
 form:'adjective + でした',
 ex:[{jp:'きのうは ひまでした。',en:'I was free yesterday.'},
     {jp:'あの 店は ゆうめいでした。',en:'That shop was famous.'}],
 note:'でした for な-adjectives and nouns; ～かったです for い-adjectives.',
 q:{s:'きのうは ひま＿＿。',a:'でした',d:['かったです','くでした','ました']}},
{p:'な-adjective ＋ な ＋ noun',grp:'adj',mean:'A な-adjective in front of a noun.',
 form:'adjective + な + noun',
 ex:[{jp:'しずかな へやが ほしいです。',en:'I want a quiet room.'},
     {jp:'きれいな はなですね。',en:'What a pretty flower.'}],
 note:'きれい and ゆうめい end in い but are な-adjectives: きれいな人 ○.',
 q:{s:'＿＿ へやが ほしいです。',a:'しずかな',d:['しずか','しずかい','しずかに']}},
{p:'～くて／～で（joining adjectives）',grp:'adj',mean:'And — joining two descriptions.',
 form:'い-adj: drop い + くて · な-adj and nouns: + で',
 ex:[{jp:'この 店は 安くて おいしいです。',en:'This shop is cheap and tasty.'},
     {jp:'この へやは しずかで きれいです。',en:'This room is quiet and clean.'}],
 note:'You cannot join adjectives with と. と is only for nouns.',
 q:{s:'この 店は ＿＿ おいしいです。',a:'安くて',d:['安いて','安くで','安いと']}},
{p:'～くなる／～になる',grp:'adj',mean:'To become ~.',
 form:'い-adj: drop い + く + なる · な-adj and nouns: + に + なる',
 ex:[{jp:'さむく なりました。',en:'It has got cold.'},
     {jp:'日本語が 好きに なりました。',en:'I have come to like Japanese.'}],
 note:'い-adjectives take く, な-adjectives take に.',
 q:{s:'さむ＿＿ なりました。',a:'く',d:['い','に','で']}},
/* --- there is / there are ------------------------------------------------ */
{p:'～があります',grp:'exist',mean:'There is ~ (things).',
 form:'thing + が + あります',
 ex:[{jp:'つくえの 上に 本が あります。',en:'There is a book on the desk.'},
     {jp:'ここに 店が あります。',en:'There is a shop here.'}],
 note:'あります for objects and plants; います for people and animals.',
 q:{s:'つくえの 上に 本が ＿＿。',a:'あります',d:['います','なります','わかります']}},
{p:'～がいます',grp:'exist',mean:'There is ~ (people and animals).',
 form:'living thing + が + います',
 ex:[{jp:'にわに いぬが います。',en:'There is a dog in the garden.'},
     {jp:'きょうしつに 先生が います。',en:'There is a teacher in the classroom.'}],
 note:'Anything alive that moves uses います.',
 q:{s:'にわに いぬが ＿＿。',a:'います',d:['あります','なります','できます']}},
{p:'～に～があります',grp:'exist',mean:'Saying where something is.',
 form:'place + に + thing + が + あります',
 ex:[{jp:'駅の 前に ぎんこうが あります。',en:'There is a bank in front of the station.'},
     {jp:'この ちかくに コンビニが ありますか。',en:'Is there a convenience store near here?'}],
 note:'に marks where something exists; で marks where an action happens.',
 q:{s:'駅の 前＿＿ ぎんこうが あります。',a:'に',d:['で','を','へ']},
 parts:['駅の','前に','ぎんこうが','あります']},
{p:'～はありません',grp:'exist',mean:'There is no ~.',
 form:'thing + は + ありません',
 ex:[{jp:'お金が ありません。',en:'I have no money.'},
     {jp:'ここに トイレは ありません。',en:'There is no toilet here.'}],
 note:'For people it is いません, not ありません.',
 q:{s:'お金が ＿＿。',a:'ありません',d:['いません','ではありません','なりません']}},
{p:'～はどこですか',grp:'exist',mean:'Where is ~ ?',
 form:'thing + は + どこですか',
 ex:[{jp:'トイレは どこですか。',en:'Where is the toilet?'},
     {jp:'駅は どこに ありますか。',en:'Where is the station?'}],
 note:'どこですか asks where something is; どこに行きますか asks where you are going.',
 q:{s:'トイレは ＿＿ですか。',a:'どこ',d:['どれ','どんな','いつ']}},
/* --- likes, wants, abilities --------------------------------------------- */
{p:'～が好きです',grp:'like',mean:'I like ~.',
 form:'thing + が + 好きです',
 ex:[{jp:'わたしは おんがくが 好きです。',en:'I like music.'},
     {jp:'日本の 食べものが 大好きです。',en:'I love Japanese food.'}],
 note:'The thing you like takes が, never を.',
 q:{s:'わたしは おんがく＿＿ 好きです。',a:'が',d:['を','に','で']},
 parts:['わたしは','日本の','おんがくが','好きです']},
{p:'～がきらいです',grp:'like',mean:'I dislike ~.',
 form:'thing + が + きらいです',
 ex:[{jp:'かれは やさいが きらいです。',en:'He dislikes vegetables.'},
     {jp:'わたしは あまい ものが きらいです。',en:'I do not like sweet things.'}],
 note:'きらい is a な-adjective, so it takes ではありません, not くないです.',
 q:{s:'かれは やさい＿＿ きらいです。',a:'が',d:['を','に','で']}},
{p:'～がじょうずです・へたです',grp:'like',mean:'Good at ~ / bad at ~.',
 form:'thing + が + じょうずです / へたです',
 ex:[{jp:'かれは 日本語が じょうずです。',en:'He is good at Japanese.'},
     {jp:'わたしは うたが へたです。',en:'I am bad at singing.'}],
 note:'Do not use じょうず about yourself; it sounds boastful. Use へた or ちょっと….',
 q:{s:'かれは 日本語＿＿ じょうずです。',a:'が',d:['を','に','で']}},
{p:'～がわかります',grp:'like',mean:'I understand ~.',
 form:'thing + が + わかります',
 ex:[{jp:'日本語が わかります。',en:'I understand Japanese.'},
     {jp:'この かんじが わかりません。',en:'I do not understand this kanji.'}],
 note:'わかります takes が. It is "understand"; しる is "get to know".',
 q:{s:'この かんじが ＿＿。',a:'わかりません',d:['わかります','わかりました','わかって']}},
{p:'～ができます',grp:'like',mean:'I can do ~.',
 form:'thing + が + できます',
 ex:[{jp:'わたしは りょうりが できます。',en:'I can cook.'},
     {jp:'かれは テニスが できます。',en:'He can play tennis.'}],
 note:'できます takes が. It covers both ability and possibility.',
 q:{s:'かれは テニスが ＿＿。',a:'できます',d:['あります','います','なります']}},
{p:'～がほしいです',grp:'like',mean:'I want ~ (a thing).',
 form:'noun + が + ほしいです',
 ex:[{jp:'新しい かばんが ほしいです。',en:'I want a new bag.'},
     {jp:'水が ほしいです。',en:'I want some water.'}],
 note:'ほしい is for things. For actions use ～たいです.',
 q:{s:'新しい かばんが ＿＿です。',a:'ほしい',d:['ほしく','ほしいな','ほしくて']}},

/* --- comparing things ---------------------------------------------------- */
{p:'～より～のほうが',grp:'comp',mean:'B is more ~ than A.',
 form:'A + より + B + のほうが + adjective',
 ex:[{jp:'電車より 車のほうが 高いです。',en:'A car is more expensive than a train.'},
     {jp:'パンより ごはんのほうが 好きです。',en:'I like rice more than bread.'}],
 note:'The winner takes のほうが; より marks what it beats.',
 q:{s:'電車より 車＿＿ほうが 高いです。',a:'の',d:['は','が','を']},
 parts:['パンより','ごはんの','ほうが','好きです']},
{p:'～と～とどちらが～ですか',grp:'comp',mean:'Which of the two is more ~ ?',
 form:'A + と + B + と + どちらが + adjective + ですか',
 ex:[{jp:'コーヒーと おちゃと どちらが 好きですか。',en:'Which do you prefer, coffee or tea?'},
     {jp:'電車と バスと どちらが はやいですか。',en:'Which is faster, the train or the bus?'}],
 note:'For two things use どちら. どれ is for three or more.',
 q:{s:'コーヒーと おちゃと ＿＿が 好きですか。',a:'どちら',d:['どれ','どこ','どんな']}},
{p:'～でいちばん～',grp:'comp',mean:'The most ~ in a group.',
 form:'group + で + いちばん + adjective',
 ex:[{jp:'日本で いちばん 高い 山は 何ですか。',en:'What is the highest mountain in Japan?'},
     {jp:'この 店で いちばん おいしい ものは これです。',en:'This is the tastiest thing in this shop.'}],
 note:'The group takes で: クラスで いちばん.',
 q:{s:'日本＿＿ いちばん 高い 山は 何ですか。',a:'で',d:['に','を','と']}},
{p:'～とおなじです',grp:'comp',mean:'It is the same as ~.',
 form:'noun + と + おなじです',
 ex:[{jp:'この かばんは あれと おなじです。',en:'This bag is the same as that one.'},
     {jp:'これは わたしのと おなじです。',en:'This is the same as mine.'}],
 note:'What you compare with takes と, not より.',
 q:{s:'この かばんは あれ＿＿ おなじです。',a:'と',d:['より','から','が']}},
{p:'あまり～ない',grp:'comp',mean:'Not very ~, not much.',
 form:'あまり + negative',
 ex:[{jp:'この 本は あまり おもしろくないです。',en:'This book is not very interesting.'},
     {jp:'おさけは あまり 飲みません。',en:'I do not drink much alcohol.'}],
 note:'あまり must have a negative after it.',
 q:{s:'この 本は あまり ＿＿です。',a:'おもしろくない',d:['おもしろい','おもしろかった','おもしろくて']}},
{p:'ぜんぜん～ない',grp:'comp',mean:'Not at all.',
 form:'ぜんぜん + negative',
 ex:[{jp:'かんじが ぜんぜん わかりません。',en:'I do not understand kanji at all.'},
     {jp:'おさけは ぜんぜん 飲みません。',en:'I do not drink alcohol at all.'}],
 note:'Stronger than あまり, and it also needs a negative.',
 q:{s:'かんじが ぜんぜん ＿＿。',a:'わかりません',d:['わかります','わかりました','わかって']}},
/* --- time and order ------------------------------------------------------ */
{p:'～前に',grp:'time',mean:'Before doing ~.',
 form:'plain form + 前に · noun + の + 前に',
 ex:[{jp:'ねる 前に 本を 読みます。',en:'I read a book before going to bed.'},
     {jp:'ごはんを 食べる 前に てを あらいます。',en:'I wash my hands before eating.'}],
 note:'前に always takes the plain form, even when talking about the past.',
 q:{s:'＿＿ 前に 本を 読みます。',a:'ねる',d:['ねます','ねて','ねた']}},
{p:'～後で',grp:'time',mean:'After doing ~.',
 form:'た-form + 後で · noun + の + 後で',
 ex:[{jp:'ごはんを 食べた 後で テレビを 見ます。',en:'I watch television after eating.'},
     {jp:'しごとの 後で 会いましょう。',en:'Let’s meet after work.'}],
 note:'後で takes the た-form; 前に takes the plain form. This trips everyone up.',
 q:{s:'ごはんを ＿＿ 後で テレビを 見ます。',a:'食べた',d:['食べる','食べます','食べて']},
 parts:['わたしは','ごはんを','食べた','後でねます']},
{p:'～とき',grp:'time',mean:'When ~, at the time of ~.',
 form:'plain form / noun + の / な-adj + な, then とき',
 ex:[{jp:'ひまな とき、えいがを 見ます。',en:'When I am free, I watch films.'},
     {jp:'子どもの とき、よく あそびました。',en:'When I was a child, I played a lot.'}],
 note:'Noun takes の, な-adjective takes な, verb takes the plain form.',
 q:{s:'ひま＿＿ とき、えいがを 見ます。',a:'な',d:['の','だ','に']}},
{p:'～ながら',grp:'time',mean:'While doing ~ (two things at once).',
 form:'ます-stem + ながら',
 ex:[{jp:'おんがくを 聞きながら べんきょうします。',en:'I study while listening to music.'},
     {jp:'テレビを 見ながら ごはんを 食べます。',en:'I eat while watching television.'}],
 note:'Both actions must be done by the same person, and it takes the ます-stem.',
 q:{s:'おんがくを ＿＿ながら べんきょうします。',a:'聞き',d:['聞く','聞いて','聞きます']}},
{p:'もう～ました',grp:'time',mean:'Already done.',
 form:'もう + past verb',
 ex:[{jp:'もう ひるごはんを 食べました。',en:'I have already had lunch.'},
     {jp:'しゅくだいは もう おわりました。',en:'The homework is already finished.'}],
 note:'もう with a past verb = already. Compare まだ + negative = not yet.',
 q:{s:'＿＿ ひるごはんを 食べました。',a:'もう',d:['まだ','また','いつも']}},
{p:'まだ～ていません',grp:'time',mean:'Not yet.',
 form:'まだ + て-form + いません',
 ex:[{jp:'ひるごはんは まだ 食べていません。',en:'I have not had lunch yet.'},
     {jp:'しゅくだいは まだ おわっていません。',en:'The homework is not finished yet.'}],
 note:'"Not yet" is まだ～ていません — not まだ～ませんでした.',
 q:{s:'ひるごはんは ＿＿ 食べていません。',a:'まだ',d:['もう','また','とても']}},
/* --- reasons and joining sentences --------------------------------------- */
{p:'～から（because）',grp:'reason',mean:'Because ~.',
 form:'sentence + から',
 ex:[{jp:'あついから、まどを あけます。',en:'It is hot, so I will open the window.'},
     {jp:'時間が ないから、いそぎましょう。',en:'There is no time, so let’s hurry.'}],
 note:'から after a whole sentence = because. After a noun = from.',
 q:{s:'あつい＿＿、まどを あけます。',a:'から',d:['まで','より','だけ']}},
{p:'～ので',grp:'reason',mean:'Because ~ (a little softer than から).',
 form:'sentence + ので · noun and な-adjective take な first',
 ex:[{jp:'雨が ふっているので、行きません。',en:'It is raining, so I am not going.'},
     {jp:'あしたは 休みなので、あそびに 行きます。',en:'Tomorrow is a holiday, so I am going out.'}],
 note:'ので sounds more polite and less blunt than から.',
 q:{s:'雨が ふっている＿＿、行きません。',a:'ので',d:['のに','より','まで']}},
{p:'～が、～（but）',grp:'reason',mean:'But, however.',
 form:'sentence + が、+ sentence',
 ex:[{jp:'この 店は 安いですが、おいしくないです。',en:'This shop is cheap, but the food is not good.'},
     {jp:'日本語は むずかしいですが、たのしいです。',en:'Japanese is difficult but fun.'}],
 note:'が joins two sentences politely. でも starts a new one.',
 q:{s:'この 店は 安いです＿＿、おいしくないです。',a:'が',d:['から','ので','まで']},
 parts:['この店は','安いですが','あまり','おいしくないです']},
{p:'～に～をあげます',grp:'reason',mean:'To give something to someone.',
 form:'person + に + thing + を + あげます',
 ex:[{jp:'友だちに プレゼントを あげました。',en:'I gave my friend a present.'},
     {jp:'母に はなを あげます。',en:'I will give my mother flowers.'}],
 note:'The receiver takes に. Never use あげる about giving to yourself.',
 q:{s:'友だち＿＿ プレゼントを あげました。',a:'に',d:['を','で','と']}},
{p:'～から～をもらいます',grp:'reason',mean:'To receive something from someone.',
 form:'person + から（or に）+ thing + を + もらいます',
 ex:[{jp:'友だちから てがみを もらいました。',en:'I received a letter from a friend.'},
     {jp:'父から お金を もらいました。',en:'I received money from my father.'}],
 note:'もらう is the opposite direction from あげる.',
 q:{s:'友だち＿＿ てがみを もらいました。',a:'から',d:['まで','へ','を']}},
{p:'～のが好きです',grp:'reason',mean:'I like doing ~.',
 form:'plain form + のが + 好きです',
 ex:[{jp:'本を 読むのが 好きです。',en:'I like reading books.'},
     {jp:'うたを うたうのが 好きです。',en:'I like singing.'}],
 note:'の turns the verb into a noun so that が好き can be used.',
 q:{s:'本を ＿＿のが 好きです。',a:'読む',d:['読みます','読んで','読んだ']}},
{p:'～ことができます',grp:'reason',mean:'To be able to do ~.',
 form:'plain form + ことができます',
 ex:[{jp:'日本語を 話すことが できます。',en:'I can speak Japanese.'},
     {jp:'ピアノを ひくことが できます。',en:'I can play the piano.'}],
 note:'Same idea as noun + ができます, but with a verb.',
 q:{s:'日本語を ＿＿ことが できます。',a:'話す',d:['話します','話して','話した']}},
/* --- question words ------------------------------------------------------ */
{p:'何（なに・なん）',grp:'qword',mean:'What.',
 form:'何 + です / を / が',
 ex:[{jp:'これは 何ですか。',en:'What is this?'},
     {jp:'何を 食べますか。',en:'What will you eat?'}],
 note:'なに on its own, but なん before です and counters: 何時, 何人.',
 q:{s:'＿＿を 食べますか。',a:'何',d:['だれ','どこ','いつ']}},
{p:'だれ・どなた',grp:'qword',mean:'Who.',
 form:'だれ + が / の / に',
 ex:[{jp:'あの 人は だれですか。',en:'Who is that person?'},
     {jp:'だれが 来ますか。',en:'Who is coming?'}],
 note:'どなた is the polite version of だれ.',
 q:{s:'あの 人は ＿＿ですか。',a:'だれ',d:['何','どこ','どれ']}},
{p:'いつ',grp:'qword',mean:'When.',
 form:'いつ + verb, with no particle',
 ex:[{jp:'いつ 日本に 来ましたか。',en:'When did you come to Japan?'},
     {jp:'テストは いつですか。',en:'When is the test?'}],
 note:'いつ takes no particle: いつ行きますか ○ / いつに行きますか ×.',
 q:{s:'＿＿ 日本に 来ましたか。',a:'いつ',d:['どこ','だれ','何']}},
{p:'どこ',grp:'qword',mean:'Where.',
 form:'どこ + に / で / です',
 ex:[{jp:'どこで 買いましたか。',en:'Where did you buy it?'},
     {jp:'どこに 行きますか。',en:'Where are you going?'}],
 note:'どこに for a destination, どこで for where something happens.',
 q:{s:'＿＿で 買いましたか。',a:'どこ',d:['だれ','いつ','何']}},
{p:'どうして・なぜ',grp:'qword',mean:'Why.',
 form:'どうして + sentence',
 ex:[{jp:'どうして 来ませんでしたか。',en:'Why did you not come?'},
     {jp:'なぜ 日本語を べんきょうしますか。',en:'Why do you study Japanese?'}],
 note:'Answer with ～から or ～ので.',
 q:{s:'＿＿ 来ませんでしたか。',a:'どうして',d:['どこ','だれ','いつ']}},
{p:'いくら・いくつ',grp:'qword',mean:'How much · how many.',
 form:'いくら for price, いくつ for a number of things',
 ex:[{jp:'これは いくらですか。',en:'How much is this?'},
     {jp:'みかんを いくつ 買いますか。',en:'How many mandarins will you buy?'}],
 note:'いくつ also asks someone’s age politely: おいくつですか.',
 q:{s:'これは ＿＿ですか。',a:'いくら',d:['いくつ','どこ','だれ']}},
{p:'どんな',grp:'qword',mean:'What kind of.',
 form:'どんな + noun',
 ex:[{jp:'どんな 本を 読みますか。',en:'What kind of books do you read?'},
     {jp:'どんな 人ですか。',en:'What sort of person is he?'}],
 note:'どんな always needs a noun after it.',
 q:{s:'＿＿ 本を 読みますか。',a:'どんな',d:['どう','どこ','どれ']}},
{p:'何時・何曜日',grp:'qword',mean:'What time · what day.',
 form:'何 + counter',
 ex:[{jp:'今 何時ですか。',en:'What time is it now?'},

var DAY_MS = 86400000, MIN_MS = 60000;
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function daysBetween(aKey, bKey){
  var a = new Date(aKey + 'T00:00:00'), b = new Date(bKey + 'T00:00:00');
  return Math.round((b - a) / DAY_MS);
}
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

var STORE_KEY = 'nihongo-n5-v1';
var storageOK = true;

function defaultState(){
  return {
    v: 1,
    cards: {},
    confusions: {},
    day: { date: dayKey(), newDone: 0, revDone: 0 },
    streak: { count: 0, last: '' },
    totals: { right: 0, wrong: 0 },

      romaji: true, furigana: true, sound: true, voice: ''
    }
  };
}

function loadState(){
  var d = defaultState();
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return d;
    var s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return d;
    for (var k in d){ if (!(k in s)) s[k] = d[k]; }
    for (var sk in d.settings){ if (!(sk in s.settings)) s.settings[sk] = d.settings[sk]; }
    return s;
  } catch (e){
    storageOK = false;
    return d;
  }
}

function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e){ storageOK = false; }
}

/* =========================================================================
   SRS — simplified SM-2. Learning steps 1 min -> 10 min -> graduate to 1 day.
   ========================================================================= */
var LEARN_STEPS = [1 * MIN_MS, 10 * MIN_MS];
var EASE_FLOOR = 1.3;

function newCard(id){
  return { id: id, ease: 2.5, interval: 0, reps: 0, lapses: 0,
           due: Date.now(), stage: 'new', step: 0, right: 0, wrong: 0, tags: [] };
}

function getCard(id, create){
  var c = state.cards[id];
  if (!c && create){ c = newCard(id); state.cards[id] = c; }
  return c;
}

function clampEase(e){ return Math.max(EASE_FLOOR, Math.round(e * 100) / 100); }

/* Interval the card gets when it leaves the learning steps or is answered in
   review. reps is the count BEFORE this answer, exactly as the spec states. */
function reviewInterval(card, g){
  if (g === 2) return Math.max(1, Math.round(card.interval * 1.2));
  if (g === 4) return Math.max(1, Math.round(Math.max(card.interval, 1) * card.ease * 1.3));
  if (card.reps === 0) return 1;
  if (card.reps === 1) return 3;
  return Math.max(1, Math.round(card.interval * card.ease));
}

function grade(id, g){
  var card = getCard(id, true);
  var now = Date.now();
  var wasReview = (card.stage === 'review');

  if (g === 1){
    card.ease = clampEase(card.ease - 0.20);
    card.lapses++;
    card.stage = 'learning';
    card.step = 0;
    card.interval = 0;
    card.due = now + LEARN_STEPS[0];
    card.wrong++;
  } else if (card.stage === 'new' || card.stage === 'learning'){
    card.right++;
    if (g === 2){
      card.ease = clampEase(card.ease - 0.15);
      card.stage = 'learning';
      card.due = now + LEARN_STEPS[Math.min(card.step, LEARN_STEPS.length - 1)];
    } else {
      if (g === 4) card.ease = clampEase(card.ease + 0.15);
      /* Good walks the steps in order: step 0 waits LEARN_STEPS[0] (1 min),
         step 1 waits LEARN_STEPS[1] (10 min), then the card graduates.
         Easy skips straight past every remaining step. */
      var stepNow = (g === 4) ? LEARN_STEPS.length : card.step;
      if (stepNow >= LEARN_STEPS.length){
        card.interval = reviewInterval(card, g);
        card.reps++;
        card.stage = 'review';
        card.step = 0;
        card.due = now + card.interval * DAY_MS;
      } else {
        card.step = stepNow + 1;
        card.stage = 'learning';
        card.due = now + LEARN_STEPS[stepNow];
      }
    }
  } else {
    card.right++;
    if (g === 2) card.ease = clampEase(card.ease - 0.15);
    if (g === 4) card.ease = clampEase(card.ease + 0.15);
    card.interval = reviewInterval(card, g);
    card.reps++;
    card.stage = 'review';
    card.due = now + card.interval * DAY_MS;
  }

  rollDay();
  if (wasReview) state.day.revDone++;
  saveState();
  return card;
}

function rollDay(){
  var today = dayKey();
  if (state.day.date !== today){
    state.day = { date: today, newDone: 0, revDone: 0 };
  }
}

function markStudiedToday(){
  var today = dayKey();
  if (state.streak.last === today) return;
  if (state.streak.last && daysBetween(state.streak.last, today) === 1) state.streak.count++;
  else state.streak.count = 1;
  state.streak.last = today;
}

/* All cards that are due right now, learning first, then oldest due first. */
function dueCards(){
  var now = Date.now(), out = [];
  for (var id in state.cards){
    var c = state.cards[id];
    if (!ITEM_BY_ID[id]) continue;
    if (c.due <= now) out.push(c);
  }
  out.sort(function(a, b){
    if (a.stage === 'learning' && b.stage !== 'learning') return -1;
    if (b.stage === 'learning' && a.stage !== 'learning') return 1;
    return a.due - b.due;
  });
  return out;
}

/* Which items you have not met yet, in the order they should be introduced.
   Kana comes first and alone — you cannot read anything without it. Once the
   46 basic hiragana are under way, new items are mixed across the four kinds
   of content following NEW_MIX, so that kanji, vocabulary and grammar all
   start moving instead of waiting months for the kana list to finish. */
var KANA_GATE = 46;
var NEW_MIX = ['kana','vocab','kanji','kana','vocab','grammar','kana','vocab','kanji','vocab'];

function newItems(){
  var byType = { kana: [], kanji: [], vocab: [], grammar: [] }, i;
  var startedKana = 0;
  for (i = 0; i < ITEMS.length; i++){
    var it = ITEMS[i];
    if (state.cards[it.id]){
      if (it.type === 'kana') startedKana++;
      continue;
    }
    if (byType[it.type]) byType[it.type].push(it);
  }
  if (startedKana < KANA_GATE && byType.kana.length) return byType.kana;

  var out = [], p = 0, guard = 0, left = byType.kana.length + byType.kanji.length +
                                       byType.vocab.length + byType.grammar.length;
  while (out.length < left && guard++ < left * NEW_MIX.length + 10){
    var t = NEW_MIX[p % NEW_MIX.length];
    p++;
    if (byType[t].length) out.push(byType[t].shift());
  }
  return out;
}

function countsToday(){
  rollDay();
  var due = dueCards(), n = newItems();
  var revCap = state.settings.limits ? Math.max(0, state.settings.revPerDay - state.day.revDone) : due.length;
  var newCap = state.settings.limits ? Math.max(0, state.settings.newPerDay - state.day.newDone) : n.length;
  return {
    dueTotal: due.length,
    newTotal: n.length,
    dueNow: Math.min(due.length, revCap),
    newNow: Math.min(n.length, newCap)
  };
}

/* =========================================================================
   AUDIO — Japanese speech (optional) + Web Audio UI sounds (no files).
   ========================================================================= */
var jaVoices = [];

function initVoices(){
  if (!window.speechSynthesis) { jaVoices = []; syncAudioUI(); return; }
  try {
    var all = speechSynthesis.getVoices() || [];
    jaVoices = all.filter(function(v){ return /^ja/i.test(v.lang || ''); });
  } catch (e){ jaVoices = []; }
  syncAudioUI();
}

function syncAudioUI(){
  var on = jaVoices.length > 0;
  $$('.audio-btn').forEach(function(b){ b.classList.toggle('hidden', !on); });
  var vs = $('#voiceSetting');
  if (vs) vs.classList.toggle('hidden', !on);
}

function speak(text){
  if (!window.speechSynthesis || !jaVoices.length) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var chosen = null;
    for (var i = 0; i < jaVoices.length; i++){
      if (jaVoices[i].name === state.settings.voice) chosen = jaVoices[i];
    }
    u.voice = chosen || jaVoices[0];
    u.lang = (u.voice && u.voice.lang) || 'ja-JP';
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e){ /* speech is optional; never break the drill */ }
}

var actx = null;
function tone(freq, dur, type, vol, delay){
  if (!state.settings.sound) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e){ /* sound is optional */ }
}
function sndOk(){ tone(659, 0.09, 'sine', 0.14, 0); tone(988, 0.12, 'sine', 0.11, 0.07); }
function sndNo(){ tone(196, 0.16, 'triangle', 0.13, 0); }
function sndDone(){ tone(523,0.12,'sine',0.13,0); tone(659,0.12,'sine',0.13,0.12); tone(784,0.22,'sine',0.13,0.24); }

/* =========================================================================
   CONFUSION TRACKING — seeded pairs plus the mistakes you actually make.
   ========================================================================= */
var CONFUSE_MAP = {};
(function buildConfuseMap(){
  for (var i = 0; i < SEED_CONFUSIONS.length; i++){
    var p = SEED_CONFUSIONS[i];
    (CONFUSE_MAP[p[0]] = CONFUSE_MAP[p[0]] || []).push(p[1]);
    (CONFUSE_MAP[p[1]] = CONFUSE_MAP[p[1]] || []).push(p[0]);
  }
})();

function recordConfusion(correctChar, chosenChar){
  if (!correctChar || !chosenChar || correctChar === chosenChar) return;
  var key = correctChar + '|' + chosenChar;
  state.confusions[key] = (state.confusions[key] || 0) + 1;
}

function confusionPartners(ch){
  var out = (CONFUSE_MAP[ch] || []).slice();
  for (var key in state.confusions){
    var p = key.split('|');
    if (p[0] === ch && out.indexOf(p[1]) < 0) out.push(p[1]);
    if (p[1] === ch && out.indexOf(p[0]) < 0) out.push(p[0]);
  }
  return out;
}

/* =========================================================================
   QUESTION BUILDING
   ========================================================================= */
function kanaAnswers(e){ return [e.r].concat(e.alt || []); }

/* Distractors never repeat the correct answer text, so a question is never
   ambiguous (じ and ぢ are both "ji" — they must not appear together). */
function kanaDistractors(item, n){
  var e = item.kana, out = [], seen = {};
  seen[e.r] = true;
  var pool = [];
  var partners = confusionPartners(e.k);
  for (var i = 0; i < partners.length; i++){
    var p = kanaByChar(partners[i]);
    if (p) pool.push(p);
  }
  var sameGroup = [], sameScript = [];
  for (var j = 0; j < KANA.length; j++){
    var c = KANA[j];
    if (c.k === e.k) continue;
    if (c.sc === e.sc && c.g === e.g) sameGroup.push(c);
    if (c.sc === e.sc) sameScript.push(c);
  }
  pool = pool.concat(shuffle(sameGroup)).concat(shuffle(sameScript)).concat(shuffle(KANA.slice()));
  for (var m = 0; m < pool.length && out.length < n; m++){
    var cand = pool[m];
    if (!cand || seen[cand.r] || cand.k === e.k) continue;
    seen[cand.r] = true;
    out.push(cand);
  }
  return out;
}

function kanaByChar(ch){
  for (var i = 0; i < KANA.length; i++){ if (KANA[i].k === ch) return KANA[i]; }
  return null;
}

/* Which drill this card gets, based on how many times it has been answered. */
function drillFor(item, card){
  var reps = card ? card.reps : 0;
  if (item.type === 'kana'){
    var seq = ['recog', 'prod', 'type', 'trace', 'recog', 'type'];
    return seq[reps % seq.length];
  }
  if (item.type === 'kanji'){
    var kseq = ['k2m', 'k2r', 'm2k', 'ktrace', 'k2m', 'k2r'];
    return kseq[reps % kseq.length];
  }
  if (item.type === 'vocab'){
    var vseq = ['j2e', 'e2j', 'j2e', 'v2r'];
    return vseq[reps % vseq.length];
  }
  if (item.type === 'grammar'){
    var gseq = ['gfill', 'gmean', 'gfill'];
    return gseq[reps % gseq.length];
  }
  return 'recog';
}

function buildQuestion(item, drill){
  var q = { item: item, drill: drill, options: [], answerIdx: -1, prompt: '', promptClass: '', label: '', explain: '' };
  if (item.type === 'kana'){
    var e = item.kana;
    if (drill === 'recog'){
      q.label = 'Which reading?';
      q.prompt = e.k; q.promptClass = 'jp-huge';
      var ds = kanaDistractors(item, 3);
      var opts = [{ text: e.r, ok: true, src: e }];
      for (var i = 0; i < ds.length; i++) opts.push({ text: ds[i].r, ok: false, src: ds[i] });
      q.options = shuffle(opts);
      q.explain = e.k + ' is read "' + e.r + '"' + (e.s ? ' — ' + e.s + ' stroke' + (e.s > 1 ? 's' : '') : '') + '.';
    } else if (drill === 'prod'){
      q.label = 'Which character?';
      q.prompt = e.r; q.promptClass = 'prompt-en';
      var ds2 = kanaDistractors(item, 3);
      var opts2 = [{ text: e.k, ok: true, jp: true, src: e }];
      for (var j = 0; j < ds2.length; j++) opts2.push({ text: ds2[j].k, ok: false, jp: true, src: ds2[j] });
      q.options = shuffle(opts2);
      q.explain = '"' + e.r + '" is written ' + e.k + '.';
    } else if (drill === 'type'){
      q.label = 'Type the reading';
      q.prompt = e.k; q.promptClass = 'jp-huge';
      q.typed = kanaAnswers(e);
      q.explain = e.k + ' is read "' + e.r + '".';
    } else {
      q.label = 'Trace it';
      q.prompt = e.k; q.promptClass = 'jp-huge';
      q.explain = e.k + ' — "' + e.r + '"' + (e.s ? ', ' + e.s + ' stroke' + (e.s > 1 ? 's' : '') : '') + '.';
    }
    for (var z = 0; z < q.options.length; z++) if (q.options[z].ok) q.answerIdx = z;
    return q;
  }
  if (typeof buildContentQuestion === 'function'){
    var cq = buildContentQuestion(item, drill, q);
    if (cq) return cq;
  }
  return q;
}

/* =========================================================================
   SESSION
   ========================================================================= */
var session = null;

function buildQueue(mode){
  rollDay();
  var q = [];
  var due = dueCards();
  var learning = [], reviews = [];
  for (var i = 0; i < due.length; i++){
    (due[i].stage === 'learning' ? learning : reviews).push(due[i]);
  }
  var revCap = state.settings.limits ? Math.max(0, state.settings.revPerDay - state.day.revDone) : reviews.length;
  var newCap = state.settings.limits ? Math.max(0, state.settings.newPerDay - state.day.newDone) : 1e9;

  if (mode !== 'new'){
    for (var l = 0; l < learning.length; l++) q.push({ id: learning[l].id, phase: 'quiz' });
    var take = reviews.slice(0, revCap);
    for (var r = 0; r < take.length; r++) q.push({ id: take[r].id, phase: 'quiz' });
  }
  if (mode !== 'review'){
    var ni = newItems().slice(0, newCap);
    for (var n = 0; n < ni.length; n++){
      q.push({ id: ni[n].id, phase: 'intro' });
      q.push({ id: ni[n].id, phase: 'quiz' });
    }
  }
  return q;
}

function buildConfusionQueue(){
  var chars = {}, q = [];
  for (var key in state.confusions){ var p = key.split('|'); chars[p[0]] = true; }
  var list = Object.keys(chars);
  if (!list.length){
    for (var i = 0; i < SEED_CONFUSIONS.length; i++){
      chars[SEED_CONFUSIONS[i][0]] = true; chars[SEED_CONFUSIONS[i][1]] = true;
    }
    list = Object.keys(chars);
  }
  shuffle(list);
  for (var j = 0; j < list.length && q.length < 24; j++){
    var e = kanaByChar(list[j]);
    if (!e) continue;
    var id = 'kana:' + e.sc + ':' + e.k;
    if (!ITEM_BY_ID[id]) continue;
    q.push({ id: id, phase: 'quiz', force: (Math.random() < 0.5 ? 'recog' : 'prod') });
  }
  return q;
}

function startSession(mode){
  var q = (mode === 'confusion') ? buildConfusionQueue() : buildQueue(mode);
  if (!q.length){
    toast(mode === 'new' ? 'No new items left — nice work.' : 'Nothing due right now.');
    render('home');
    return;
  }
  session = { mode: mode, queue: q, idx: 0, right: 0, wrong: 0, answered: 0, startedAt: Date.now() };
  render('session');
}

function endSession(){
  var s = session; session = null;
  sndDone();
  markStudiedToday();
  saveState();
  render('home', { summary: s });
}

function currentEntry(){ return session ? session.queue[session.idx] : null; }

function advance(){
  session.idx++;
  if (session.idx >= session.queue.length) endSession();
  else render('session');
}

/* A card still in its 1-minute / 10-minute learning steps comes back inside
   the same sitting rather than tomorrow. */
function reinsert(id){
  var c = state.cards[id];
  if (!c) return;
  if (c.due - Date.now() > 11 * MIN_MS) return;
  var pos = Math.min(session.queue.length, session.idx + 4);
  session.queue.splice(pos, 0, { id: id, phase: 'quiz' });
}

/* wasNew must be read BEFORE grading, because grading creates the card.
   Reviews are counted inside grade(); new items are counted here. */
function applyGrade(id, g, wasNew){
  grade(id, g);
  if (wasNew) state.day.newDone++;
  if (session) reinsert(id);
  saveState();
}

/* =========================================================================
   RENDERING — screens are plain strings, rebuilt on every change.
   ========================================================================= */
var screenName = 'home';
var pendingSummary = null;

function render(name, opts){
  if (name) screenName = name;
  if (opts && opts.summary) pendingSummary = opts.summary;
  var main = $('#main');
  var html = '';
  if (screenName === 'home') html = screenHome();
  else if (screenName === 'learn') html = screenLearn();
  else if (screenName === 'review') html = screenReview();
  else if (screenName === 'progress') html = screenProgress();
  else if (screenName === 'settings') html = screenSettings();
  else if (screenName === 'session') html = screenSession();
  else if (screenName === 'exam' && typeof screenExam === 'function') html = screenExam();
  main.innerHTML = html;
  $$('#nav button').forEach(function(b){
    b.setAttribute('aria-current', b.getAttribute('data-nav') === screenName ? 'true' : 'false');
  });
  syncAudioUI();
  if (screenName === 'session') afterSessionRender();
  window.scrollTo(0, 0);
}

function taggedCount(tag){
  var n = 0;
  for (var id in state.cards){
    var c = state.cards[id];
    if (ITEM_BY_ID[id] && c.tags && c.tags.indexOf(tag) >= 0) n++;
  }
  return n;
}

function stat(big, label){
  return '<div class="stat"><b>' + esc(big) + '</b><span>' + esc(label) + '</span></div>';
}

/* ---------- SESSION ---------- */
function screenSession(){
  var entry = currentEntry();
  if (!entry) return '';
  var item = ITEM_BY_ID[entry.id];
  var card = state.cards[entry.id];
  var pctDone = Math.round(session.idx / session.queue.length * 100);

  var head = '<div class="sessionbar" id="sessBar">' + sessionBarHTML() + '</div>' +
             '<div class="progressbar"><i style="width:' + pctDone + '%"></i></div>';

  if (entry.phase === 'intro') return head + introHTML(item);

  var drill = entry.force || drillFor(item, card);
  session.q = buildQuestion(item, drill);
  return head + questionHTML(session.q);
}

function sessionBarHTML(){
  return '<span>' + (session.idx + 1) + ' / ' + session.queue.length + '</span>' +
         '<span>' + session.right + ' ✓ &nbsp; ' + session.wrong + ' ✗</span>';
}

function introHTML(item){
  var h = '<div class="card center">';
  if (item.type === 'kana'){
    var e = item.kana;
    h += '<div class="prompt-label">New character</div>';
    h += '<div class="jp-huge jp">' + esc(e.k) + '</div>';
    h += '<div style="font-size:30px;font-weight:600;margin-top:4px">' + esc(e.r) + '</div>';
    h += '<p class="muted">' + esc(scriptName(e.sc)) + (e.s ? ' · ' + e.s + ' stroke' + (e.s > 1 ? 's' : '') : '') + '</p>';
    h += '<button class="btn btn-sm audio-btn" data-act="speak" data-text="' + esc(e.k) + '">🔊 Listen</button>';
  } else if (typeof introContentHTML === 'function'){

     pattern has nothing to trace, so the button is not offered. */

function scriptName(sc){ return sc === 'hira' ? 'Hiragana' : 'Katakana'; }

function questionHTML(q){
  var h = '';
  if (q.drill === 'trace') return traceHTML(q);

  h += '<div class="prompt"><div class="prompt-label">' + esc(q.label) + '</div>' +

function traceHTML(q){

  h += '<div class="trace-wrap"><div class="trace-ghost jp">' + esc(q.prompt) + '</div>' +

  h += '</div>';
  h += '<p class="muted center">How did that go?</p>';
  h += gradesHTML();
  return h;
}

function gradesHTML(){
  return '<div class="grades">' +
    '<button class="btn" data-grade="1">Again<small>&lt;1 min</small></button>' +
    '<button class="btn" data-grade="2">Hard<small>shorter</small></button>' +
    '<button class="btn btn-primary" data-grade="3">Good<small>normal</small></button>' +
    '<button class="btn" data-grade="4">Easy<small>longer</small></button>' +
    '</div>';
}

function afterSessionRender(){
  var tb = $('#typebox');
  if (tb){
    tb.addEventListener('input', onTyping);
    setTimeout(function(){ try { tb.focus(); } catch (e){} }, 30);
  }
  if ($('#traceCanvas')) initTrace();
  /* Deliberately silent before you answer: hearing the character would give
     the reading away. Audio plays in the feedback instead. The one exception
     is the listening drill, where the audio IS the question. */
  if (session && session.q && session.q.autoSpeak) speak(session.q.speakText);
}

/* ---------- answering ---------- */
function onTyping(ev){
  var q = session && session.q;
  if (!q || !q.typed || q.locked) return;
  var box = ev.target;
  var val = box.value.toLowerCase().replace(/[^a-z]/g, '');
  if (!val){ box.className = 'typebox'; return; }
  for (var i = 0; i < q.typed.length; i++){
    if (val === q.typed[i]){ box.className = 'typebox ok'; return finishAnswer(true, null); }
  }
  for (var j = 0; j < q.typed.length; j++){
    if (q.typed[j].indexOf(val) === 0){ box.className = 'typebox'; return; }
  }
  box.className = 'typebox no';
  finishAnswer(false, null);
}

function chooseOption(idx){
  var q = session && session.q;
  if (!q || q.locked || !q.options.length) return;
  var o = q.options[idx];
  if (!o) return;
  var btns = $$('#choices .choice');
  if (btns[idx]) btns[idx].classList.add(o.ok ? 'correct' : 'wrong');
  if (!o.ok && btns[q.answerIdx]) btns[q.answerIdx].classList.add('correct');
  finishAnswer(o.ok, o);
}

function finishAnswer(ok, option){
  var q = session.q;
  if (q.locked) return;
  q.locked = true;
  var entry = currentEntry();
  var wasNew = !state.cards[entry.id] || state.cards[entry.id].stage === 'new';

  session.answered++;
  if (ok){ session.right++; state.totals.right++; sndOk(); }
  else { session.wrong++; state.totals.wrong++; sndNo(); }

  if (q.item.type === 'kana'){
    if (ok) state.kanaAcc.right++; else state.kanaAcc.wrong++;
    if (!ok && option && option.src) recordConfusion(q.item.kana.k, option.src.k);
  }

  applyGrade(entry.id, ok ? 3 : 1, wasNew);
  maybeDisableRomaji();

  var bar = $('#sessBar');
  if (bar) bar.innerHTML = sessionBarHTML();
  var fb = $('#fb');
  var host = $('.prompt') || $('.card');
  if (host) host.classList.add(ok ? 'anim-ok' : 'anim-no');
  if (fb){
    fb.innerHTML = '<div class="feedback ' + (ok ? 'good' : 'bad') + '">' +
      (ok ? '✓ ' : '✗ ') + esc(q.explain) +
      (q.extra ? '<div class="tiny" style="margin-top:4px;color:inherit">' + q.extra + '</div>' : '') +
      '</div><button class="btn btn-primary" style="width:100%" data-act="next">Continue</button>';
  }
  speak(q.item.type === 'kana' ? q.item.kana.k : (q.speakText || ''));
  if (ok) setTimeout(function(){ if (session && session.q === q) advance(); }, 900);
}

function selfGrade(g){
  var entry = currentEntry();
  if (!entry) return;
  var wasNew = !state.cards[entry.id] || state.cards[entry.id].stage === 'new';
  session.answered++;
  if (g >= 3){ session.right++; state.totals.right++; sndOk(); }
  else { session.wrong++; state.totals.wrong++; sndNo(); }
  applyGrade(entry.id, g, wasNew);
  advance();
}

function maybeDisableRomaji(){
  if (state.romajiAutoOff || !state.settings.romaji) return;
  var t = state.kanaAcc.right + state.kanaAcc.wrong;
  if (t >= 50 && state.kanaAcc.right / t > 0.90){
    state.settings.romaji = false;
    state.romajiAutoOff = true;
    saveState();
    toast('Romaji hints turned off — your kana accuracy is over 90%.');
  }
}

/* ---------- TRACING — faded CSS text behind a transparent canvas ---------- */
function initTrace(){
  var cv = $('#traceCanvas');
  if (!cv) return;
  var rect = cv.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  var ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#1e2340';
  var drawing = false;

  function pos(ev){
    var r = cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  cv.addEventListener('pointerdown', function(ev){
    drawing = true;
    try { cv.setPointerCapture(ev.pointerId); } catch (e){}
    var p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); ev.preventDefault();
  });
  cv.addEventListener('pointermove', function(ev){
    if (!drawing) return;
    var p = pos(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); ev.preventDefault();
  });
  cv.addEventListener('pointerup', function(){ drawing = false; });
  cv.addEventListener('pointerleave', function(){ drawing = false; });
  initTrace.clear = function(){ ctx.clearRect(0, 0, cv.width, cv.height); };
}

function upcoming(){
  var buckets = [0, 0, 0, 0, 0], now = Date.now();
  for (var id in state.cards){
    if (!ITEM_BY_ID[id]) continue;
    var d = state.cards[id].due - now;
    if (d <= 0) buckets[0]++;
    else if (d < DAY_MS) buckets[1]++;
    else if (d < 3 * DAY_MS) buckets[2]++;
    else if (d < 7 * DAY_MS) buckets[3]++;
    else buckets[4]++;
  }
  return [
    { label: 'Due now', n: buckets[0] },
    { label: 'Later today', n: buckets[1] },
    { label: 'Next 3 days', n: buckets[2] },
    { label: 'This week', n: buckets[3] },
    { label: 'Beyond a week', n: buckets[4] }
  ];
}

/* ---------- PROGRESS ---------- */
function mastery(id){
  var c = state.cards[id];
  if (!c) return 0;
  if (c.stage !== 'review') return 1;
  if (c.interval < 3) return 2;
  if (c.interval < 14) return 3;
  return 4;
}

var BUCKETS = [
  { key: 'kana', label: 'Kana', w: 0.20 },
  { key: 'kanji', label: 'Kanji', w: 0.25 },
  { key: 'vocab', label: 'Vocabulary', w: 0.35 },
  { key: 'grammar', label: 'Grammar', w: 0.20 }
];

function bucketScore(type){
  var n = 0, sum = 0;
  for (var i = 0; i < ITEMS.length; i++){
    if (ITEMS[i].type !== type) continue;
    n++; sum += mastery(ITEMS[i].id) / 4;
  }
  return { n: n, score: n ? sum / n : 0 };
}

function stats(){
  var started = 0;
  for (var id in state.cards){ if (ITEM_BY_ID[id]) started++; }
  var t = state.totals.right + state.totals.wrong;
  var ready = 0;
  for (var i = 0; i < BUCKETS.length; i++){
    ready += BUCKETS[i].w * bucketScore(BUCKETS[i].key).score;
  }
  return {
    total: ITEMS.length,
    started: started,
    due: dueCards().length,
    streak: state.streak.count,
    accuracy: t ? Math.round(state.totals.right / t * 100) : 0,
    readiness: Math.round(ready * 100),
    answers: t
  };
}

function gridHTML2(sc, rows, cols, yoon){
  var h = '<div class="chart' + (yoon ? ' yoon' : '') + '">';
  for (var r = 0; r < rows.length; r++){
    for (var c = 0; c < cols.length; c++){

      if (col === null){ h += '<div class="cell empty"></div>'; continue; }

function topConfusions(){
  var out = [];
  for (var key in state.confusions){
    var p = key.split('|');
    out.push({ a: p[0], b: p[1], n: state.confusions[key] });
  }
  out.sort(function(x, y){ return y.n - x.n; });
  return out.slice(0, 8);
}

/* =========================================================================
   EVENTS
   ========================================================================= */
document.addEventListener('click', function(ev){
  var t = ev.target.closest ? ev.target.closest('[data-act],[data-nav],[data-tab],[data-opt],[data-grade],[data-toggle]') : null;
  if (!t) return;

  var nav = t.getAttribute('data-nav');
  if (nav){ session = null; render(nav); return; }

  var tab = t.getAttribute('data-tab');
  if (tab){ learnTab = tab; render('learn'); return; }

  var opt = t.getAttribute('data-opt');
  if (opt !== null && opt !== undefined){ chooseOption(parseInt(opt, 10)); return; }

  var gr = t.getAttribute('data-grade');
  if (gr){ selfGrade(parseInt(gr, 10)); return; }

  var tg = t.getAttribute('data-toggle');
  if (tg){
    state.settings[tg] = !state.settings[tg];
    if (tg === 'romaji' && state.settings.romaji) state.romajiAutoOff = false;
    saveState(); render();
    return;
  }

  var act = t.getAttribute('data-act');
  if (!act) return;
  if (act === 'speak'){ speak(t.getAttribute('data-text')); return; }
  if (act === 'study-today'){ startSession('today'); return; }
  if (act === 'study-review'){ startSession('review'); return; }
  if (act === 'study-new'){ startSession('new'); return; }
  if (act === 'study-confusion'){ startSession('confusion'); return; }
  if (act === 'next'){ advance(); return; }
  if (act === 'intro-next'){ advance(); return; }
  if (act === 'intro-trace'){ showIntroTrace(); return; }
  if (act === 'intro-known'){
    var e = currentEntry();
    applyGrade(e.id, 4, true);
    dropNextQuiz(e.id);
    advance();
    return;
  }
  if (act === 'trace-clear'){ if (initTrace.clear) initTrace.clear(); return; }
  if (act === 'selftest'){
    var rep = NM.selfTest();
    $('#testout').innerHTML = '<pre class="report">' + esc(formatReport(rep)) + '</pre>';
    return;
  }
  if (act === 'reset'){
    if (window.confirm('Erase all progress and start over? This cannot be undone.')){
      NM.reset(); toast('Progress erased.'); render('home');
    }
    return;
  }
  if (typeof onExtraAction === 'function') onExtraAction(act, t);
});

document.addEventListener('change', function(ev){
  var t = ev.target;
  var setKey = t.getAttribute && t.getAttribute('data-set');
  if (setKey){
    state.settings[setKey] = t.value;
    saveState();
    if (setKey === 'theme') applyTheme();
    return;
  }
  var numKey = t.getAttribute && t.getAttribute('data-num');
  if (numKey){
    var v = parseInt(t.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    state.settings[numKey] = v;
    saveState();
  }
});

document.addEventListener('keydown', function(ev){
  if (ev.target && /input|select|textarea/i.test(ev.target.tagName) && ev.key !== 'Escape') return;
  if (ev.key === 'Escape'){
    if (session){ session = null; render('home'); }
    return;
  }
  if (!session) return;
  var entry = currentEntry();
  if (ev.key === ' ' || ev.key === 'Spacebar'){
    ev.preventDefault();
    if (entry && entry.phase === 'intro') advance();
    else if (session.q && session.q.locked) advance();
    return;
  }
  if (/^[1-4]$/.test(ev.key)){
    if (session.q && session.q.drill === 'trace'){ selfGrade(parseInt(ev.key, 10)); return; }
    if (session.q && session.q.options.length){ chooseOption(parseInt(ev.key, 10) - 1); }
  }
});

function formatReport(rep){

  for (var i = 0; i < rep.checks.length; i++){
    var c = rep.checks[i];
